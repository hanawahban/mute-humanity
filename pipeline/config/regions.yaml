# bbox: south/north in degrees latitude, west/east in degrees longitude (-180..180).
# west > east means the box wraps the antimeridian.
regions:
  - {id: global,          name: Global,           bbox: {south: -90, north: 90, west: -180, east: 180}}
  - {id: arabian_gulf,    name: Arabian Gulf,     bbox: {south: 24,  north: 30, west: 48,   east: 57}}
  - {id: sahara,          name: Sahara,           bbox: {south: 15,  north: 30, west: -15,  east: 35}}
  - {id: amazon,          name: Amazon,           bbox: {south: -12, north: 4,  west: -75,  east: -52}}
  - {id: central_africa,  name: Central Africa,   bbox: {south: -6,  north: 6,  west: 10,   east: 30}}
  - {id: india,           name: India,            bbox: {south: 8,   north: 28, west: 70,   east: 88}}
  - {id: eastern_china,   name: Eastern China,    bbox: {south: 24,  north: 40, west: 110,  east: 122}}
  - {id: europe,          name: Europe,           bbox: {south: 36,  north: 60, west: -10,  east: 30}}
  - {id: us_east,         name: US East,          bbox: {south: 28,  north: 46, west: -90,  east: -70}}
  - {id: southeast_asia,  name: Southeast Asia,   bbox: {south: -8,  north: 20, west: 95,   east: 125}}
  - {id: australia,       name: Australia,        bbox: {south: -38, north: -12, west: 114, east: 152}}
  - {id: southern_ocean,  name: Southern Ocean,   bbox: {south: -65, north: -50, west: -180, east: 180}}
  - {id: north_pacific_gyre, name: North Pacific gyre, bbox: {south: 20, north: 40, west: 135, east: -145}}
